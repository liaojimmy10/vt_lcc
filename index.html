<div class="stage">
  <!-- 右側看戲的小人偶。不想要就刪掉這行 -->
  <img class="watcher watcher-right" src="right.png" alt="">

  <main class="wrap">
    <section class="bar">
      <h2 id="filter-label">作品一覽</h2>
      <div class="chips" role="group" aria-labelledby="filter-label" id="chips"></div>
    </section>

    <div class="grid" id="grid"></div>
  </main>
</div>

<!-- 頁尾。上面那條線跟著 footer 走（整頁滿版），
     文字收在裡面的 .wrap，維持跟卡片同一條右邊界 -->
<footer>
  <div class="wrap">liaojimmy05@gmail.com</div>
</footer>

<dialog class="player" id="player">
  <div class="frame">
    <div id="slot"></div>
    <div class="frame-bar">
      <span id="playerTitle"></span>
      <button class="close" id="closeBtn">關閉</button>
    </div>
  </div>

  <!-- 浮在播放框右邊的小圖 -->
  <img class="player-side" src="left.png" alt="">
</dialog>
